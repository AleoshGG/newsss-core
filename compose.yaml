services:
  db:
    image: pgvector/pgvector:pg17
    container_name: newsss-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  nessss-core:
    build: .
    container_name: newsss-core
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:${DB_PORT}/${DB_NAME}
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn src.app:app --host 0.0.0.0 --port 8000"
    
    depends_on:
      db:
        condition: service_healthy

volumes: 
  db_data: